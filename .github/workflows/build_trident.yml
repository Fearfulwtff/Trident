name: Build Trident Viewer (Windows, open source config)

on:
  workflow_dispatch:

env:
  AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/build-variables/variables
  AUTOBUILD_VSVER: "170"
  XZ_DEFAULTS: -T0

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Firestorm build variables
        uses: actions/checkout@v4
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install pillow numpy

      - name: Unzip Trident kit
        shell: bash
        run: python -m zipfile -e trident-kit.zip .

      - name: Apply Trident branding
        shell: bash
        run: python trident-kit/apply_trident.py .

      - name: Configure
        shell: bash
        run: autobuild configure -c ReleaseFS_open -A64 -- --package --chan Trident

      - name: Build
        shell: bash
        run: autobuild build -c ReleaseFS_open -A64 --no-configure

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trident-viewer-windows
          path: |
            build-vc170-64/newview/Release
            build-vc170-64/newview/*.exe
          if-no-files-found: warn
